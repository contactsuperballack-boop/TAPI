# Local development stack: Postgres + one-shot migration + API + booking poller + outbox dispatcher.
# NOT a production deployment. Never put real credentials in this file; use a local .env (git-ignored).
services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: tapi, POSTGRES_PASSWORD: tapi, POSTGRES_DB: tapi }
    ports: ["5432:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U tapi"], interval: 5s, timeout: 5s, retries: 12 }
    volumes: [dbdata:/var/lib/postgresql/data]

  migrate:
    build: .
    command: ["node", "src/db/migrate.js"]
    env_file: [.env]
    environment: { DATABASE_URL: "postgres://tapi:tapi@db:5432/tapi" }
    depends_on: { db: { condition: service_healthy } }
    restart: "no"

  api:
    build: .
    env_file: [.env]
    environment: { DATABASE_URL: "postgres://tapi:tapi@db:5432/tapi" }
    ports: ["3000:3000"]
    depends_on: { migrate: { condition: service_completed_successfully } }

  poller:
    build: .
    command: ["node", "src/scripts/pollBookings.js"]
    env_file: [.env]
    environment: { DATABASE_URL: "postgres://tapi:tapi@db:5432/tapi" }
    depends_on: { migrate: { condition: service_completed_successfully } }
    restart: unless-stopped

  outbox:
    build: .
    command: ["node", "src/scripts/dispatchOutbox.js"]
    env_file: [.env]
    environment: { DATABASE_URL: "postgres://tapi:tapi@db:5432/tapi" }
    depends_on: { migrate: { condition: service_completed_successfully } }
    restart: unless-stopped

  settle:
    build: .
    command: ["node", "src/scripts/settleSweep.js"]
    env_file: [.env]
    environment: { DATABASE_URL: "postgres://tapi:tapi@db:5432/tapi" }
    depends_on: { migrate: { condition: service_completed_successfully } }
    restart: unless-stopped

volumes:
  dbdata:
