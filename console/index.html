<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TAPI Mobility Console</title><style>body{font:14px system-ui;margin:0;background:#f5f7fb;color:#172033}header{background:#172033;color:white;padding:18px 24px;display:flex;justify-content:space-between;align-items:center}main{padding:24px;max-width:1200px;margin:auto}.toolbar{display:flex;gap:8px;margin-bottom:18px}input,button{padding:9px;border:1px solid #ccd3df;border-radius:6px}button{cursor:pointer;background:#1c64f2;color:white;border:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card,section{background:white;border:1px solid #e3e8f0;border-radius:10px;padding:16px;margin-bottom:18px}.metric{font-size:26px;font-weight:700;margin-top:8px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid #edf0f5}small{color:#697386}.error{color:#b42318}</style></head><body><header><strong>TAPI Mobility Operations</strong><span id="updated"><small>Not loaded</small></span></header><main><div class="toolbar"><input id="apiKey" placeholder="Agency API key" size="38"><button id="save">Save key</button><button id="refresh">Refresh live data</button></div><div id="error" class="error"></div><div class="grid" id="metrics"></div><section><h2>Trip inventory</h2><table><thead><tr><th>Trip</th><th>Route</th><th>Departure</th><th>Status</th><th>Available</th><th>Total</th></tr></thead><tbody id="trips"></tbody></table></section><section><h2>Recent bookings</h2><table><thead><tr><th>Reference</th><th>Trip</th><th>Route</th><th>Status</th><th>Amount</th></tr></thead><tbody id="bookings"></tbody></table></section><section><h2>Integrations and settlements</h2><div class="grid"><div><h3>Integrations</h3><div id="integrations"></div></div><div><h3>Settlements</h3><div id="settlements"></div></div></div></section></main><script src="./app.js"></script></body></html>
