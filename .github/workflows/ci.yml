name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Unit + syntax (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check:syntax
      - run: npm run test:unit
      - name: Dependency audit (production deps; informational until baseline is clean)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  integration:
    name: Postgres integration (migrations + Jest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tapi
          POSTGRES_PASSWORD: tapi
          POSTGRES_DB: tapi_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tapi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGPASSWORD: tapi
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # 1. Migrations apply from zero on an EMPTY database, and a second run is a no-op.
      - name: Create empty database for the migration check
        run: psql -h localhost -U tapi -d tapi_test -c "CREATE DATABASE tapi_migrate"
      - name: Migrate from zero
        run: npm run migrate
        env:
          DATABASE_URL: postgres://tapi:tapi@localhost:5432/tapi_migrate
      - name: Migrate again (must skip everything)
        run: |
          out=$(npm run migrate 2>&1)
          echo "$out"
          if echo "$out" | grep -E '^apply ' ; then echo "second migrate run applied something"; exit 1; fi
        env:
          DATABASE_URL: postgres://tapi:tapi@localhost:5432/tapi_migrate

      # 2. Full Jest suite against a throwaway schema. tests/setup.js DROPS the public schema: CI database only.
      - name: Jest (integration)
        run: npm test
        env:
          NODE_ENV: test
          TEST_DATABASE_URL: postgres://tapi:tapi@localhost:5432/tapi_test
          DATABASE_URL: postgres://tapi:tapi@localhost:5432/tapi_test

  web:
    name: Web build + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm run build
      - run: npm test
